services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the compiled JS at build time (Flutter web has no
        # runtime config) - must match wherever the browser will actually
        # reach the backend, e.g. http://localhost:${BACKEND_PORT} if you
        # override that above. Also update CORS_ORIGINS in .env to match
        # FRONTEND_PORT below, or the browser's API calls will be rejected.
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
